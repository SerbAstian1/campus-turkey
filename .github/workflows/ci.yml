name: CI

# Every step below is blocking. A check that runs but does not block a merge is a
# status light, not a gate — see Department 22.2.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same branch. Without this, a busy
  # branch queues runs that are already answering a stale question.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  web:
    name: web — typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` not `install`: it installs exactly the lockfile and fails if package.json
      # and the lock have drifted, which is the point of committing a lockfile.
      - name: Install
        working-directory: web
        run: npm ci

      - name: Generate Prisma client
        working-directory: web
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # The rules `tsc` has no opinion about: the `jsx-a11y` set on the markup, and
      # rules-of-hooks on the client components. Before `web/eslint.config.mjs` there
      # was no lint layer here at all — `next lint` prompted for setup instead of
      # running, so the check silently did nothing. Audit finding m4.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test with coverage
        working-directory: web
        # The coverage thresholds in vitest.config.ts are part of this gate. The money
        # path is held at 100%; a dropped branch fails the build rather than a review.
        run: npm run test:coverage

      # The design system lives in `_ds/` and is copied into web/public by this step.
      # It is not committed — see the root .gitignore — so a build without it produces a
      # site that serves unstyled markup with no components. `prebuild` refuses to build
      # in that state; this is what puts the files there.
      - name: Install root tooling
        run: npm install --no-audit --no-fund

      - name: Sync the design system into web/public
        run: npm run setup

      # `npm run build`, not `npx next build`: the former runs the `prebuild` guard.
      #
      # Two things about this env block are easy to get wrong, and both were:
      #
      #   1. It has to satisfy *every* production config rule, not the memorable ones.
      #      Storage and mail were missing, so the build failed at page-data collection
      #      naming them — after a green compile, which is the confusing order.
      #   2. `DATABASE_URL` must reach a **real** database. `generateStaticParams` for
      #      `/universities/[slug]` reads the catalogue at build time (P04 moved it into
      #      Postgres), so a placeholder URL fails the build rather than prerendering
      #      nothing. A Neon branch is the intended source; the secret is set per repo.
      - name: Build
        working-directory: web
        run: npm run build
        env:
          # A real, reachable branch database. Not a placeholder — see note 2 above.
          # The secret must carry `?pool_timeout=60&connect_timeout=60`: waking a
          # suspended Neon compute takes ~8s against Prisma's 10s default, and the first
          # query of a cold build otherwise fails at page 0. See DEPLOYMENT.md,
          # "The build needs a real database".
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.CI_DIRECT_DATABASE_URL }}
          # Not shape-only, unlike most of the placeholders below. `next build` renders
          # the canonicals, the `hreflang` set and all 918 sitemap rows, so whatever is
          # set here is written into the output rather than merely satisfying a guard.
          # It must be the real production origin.
          SITE_ORIGIN: https://campusturkey.org
          SESSION_SECRET: ci-placeholder-secret-at-least-32-chars-long
          NODE_ENV: production
          SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          # hcaptcha is the implemented provider, so CI builds what production runs.
          # The site key is NEXT_PUBLIC_ and therefore inlined at build time; a
          # placeholder is correct because CI never solves a challenge.
          CAPTCHA_PROVIDER: hcaptcha
          CAPTCHA_SECRET: placeholder
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: placeholder
          # Values are shape-only. The config guard checks that each provider's
          # companions are present, which is the rule being satisfied here; nothing in a
          # build ever calls S3 or the mail provider.
          STORAGE_PROVIDER: s3
          S3_BUCKET: placeholder
          S3_REGION: eu-west-2
          S3_ACCESS_KEY_ID: placeholder
          S3_SECRET_ACCESS_KEY: placeholder
          S3_ENDPOINT: https://s3.eu-west-2.amazonaws.com
          MAIL_PROVIDER: resend
          MAIL_API_KEY: placeholder
          MAIL_FROM: no-reply@campusturkey.org
          # Inlined into the browser bundle at build time, so it has to be present for
          # the build and not only at runtime. A placeholder is correct here: CI never
          # loads a tile, and the boot check only asserts the variable exists. The real
          # key belongs in the deployment's build environment.
          NEXT_PUBLIC_MAPTILER_KEY: placeholder
          CRON_SECRET: ci-placeholder-cron-secret

      # Handoff note 14 is explicit that `npm audit fix --force` breaks this build and
      # that the reported findings are dev-only and unreachable. So this reports and
      # does not block: an advisory count that fails CI trains people to ignore CI.
      # `--omit=dev` narrows it to what actually ships.
      - name: Audit production dependencies (report only)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high || true

  integration:
    name: integration — the money path against a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Why this job exists, and why it is separate.
    #
    # `tests/integration/` proves the four things a single-connection database cannot
    # express: two simultaneous requests for one balance producing exactly one
    # withdrawal, idempotent replay returning the original row, the state machine
    # refusing a PARTNER actor beneath the route guard, and the append-only trigger
    # holding against real Postgres rather than WASM. Every one of them is on the money
    # path, and none is reachable from the unit suite by construction.
    #
    # It used to run only when somebody remembered to type the command. A guarantee that
    # depends on a person remembering is not a gate — that is audit finding M3.
    #
    # Separate from `web` rather than appended to it so the fast checks are not queued
    # behind a database container starting; both must pass for the run to pass.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_turkey_test
        ports:
          - 5432:5432
        # Without a health check the first step races the container's boot and fails on
        # connection refused, which reads as a broken test rather than a slow start.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway container, torn down with the runner. The suite's own warning about
      # never pointing this at production is satisfied by construction here.
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_turkey_test
      DIRECT_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_turkey_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Generate Prisma client
        working-directory: web
        run: npx prisma generate

      # `migrate deploy`, not `db push`: it applies the committed migration files in
      # order, which is what production will run. `db push` would build the schema from
      # `schema.prisma` and silently skip the triggers, CHECK constraints and the
      # reference sequence that live only in the migration SQL — the very things
      # `schema-integrity` and the append-only assertions are about.
      - name: Apply migrations
        working-directory: web
        run: npx prisma migrate deploy

      - name: Integration tests
        working-directory: web
        run: npm run test:integration

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then removed is still in the history,
          # and git history is forever. Scanning only the tip finds nothing.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
