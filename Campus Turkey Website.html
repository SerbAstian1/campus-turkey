   the same way, with tap targets at 48px. */
function MobileNav({ lang, onLangChange, route }) {
  const [open, setOpen] = React.useState(false);
  const [section, setSection] = React.useState(null);
  const T = window.T;

  React.useEffect(() => { setOpen(false); setSection(null); }, [route]);
  React.useEffect(() => {
    if (!open) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [open]);

  const groups = [
    { key: "education", label: T("footer.education"), icon: "graduation-cap", links: [
      ["Study in Türkiye", "study", "graduation-cap"],
      ["University directory", "universities", "landmark"],
      ["Scholarships", "study", "award"],
      ["Resources", "resources", "book-open"]] },
    { key: "services", label: T("footer.services"), icon: "heart-pulse", links: [
      ["Medical Tourism", "service/medical", "heart-pulse"],
      ["Business Facilitation", "service/business", "briefcase"],
      ["Employment", "service/employment", "hard-hat"],
      ["Educational tours", "service/tours", "bus-front"]] },
    { key: "partners", label: T("footer.partners"), icon: "handshake", links: [
      ["Become a Partner", "partners", "handshake"],
      ["Become a Representative", "representative", "globe"],
      ["For universities", "institutions/universities", "landmark"],
      ["For agencies", "institutions/agencies", "users"],
      ["For hospitals", "institutions/hospitals", "stethoscope"],
      ["Partner Login", "portal", "log-in"]] },
    { key: "company", label: T("footer.company"), icon: "info", links: [
      ["About us", "about", "info"],
      ["Contact", "contact", "phone"]] },
  ];

  const go = (r) => { setOpen(false); setSection(null); window.CT_GO(r); };

  return (
    <div className="ct-mobile-nav">
      <div className="ct-mobile-bar">
        <a href="#/home" onClick={(e) => { e.preventDefault(); go("home"); }} style={{ display: "inline-flex", alignItems: "center" }}>
          <DSK.Logo variant="lockup" theme="onLight" height={34} assetBase={AK} />
        </a>
        <div style={{ display: "flex", alignItems: "center", gap: "var(--space-2)", marginInlineStart: "auto" }}>
          <DSK.LanguageSwitcher value={lang} onChange={onLangChange} theme="onLight" compact />
          <button type="button" className="ct-burger" aria-label="Menu" aria-expanded={open}
            onClick={() => setOpen(!open)}>
            <span className={open ? "on" : ""}></span>
            <span className={open ? "on" : ""}></span>
          </button>
        </div>
      </div>

      <div className="ct-mobile-panel" aria-hidden={!open}
        style={{ transform: open ? "translateY(0)" : "translateY(-8px)", opacity: open ? 1 : 0, pointerEvents: open ? "auto" : "none", visibility: open ? "visible" : "hidden" }}>
        <DSK.Button variant="primary" size="lg" fullWidth onClick={() => go("apply")}>{T("cta.apply")}</DSK.Button>
        <DSK.Button variant="secondary" size="lg" fullWidth icon="calendar-check" onClick={() => go("contact")}>{T("cta.consult")}</DSK.Button>
        <nav>
          {groups.map((g) => {
            const on = section === g.key;
            return (
              <div key={g.key} className="ct-mobile-group">
                <button type="button" aria-expanded={on} onClick={() => setSection(on ? null : g.key)}>
                  <DSK.Icon name={g.icon} size={18} color="var(--green-600)" />
                  <span>{g.label}</span>
                  <DSK.Icon name="chevron-down" size={16} strokeWidth={2.5}
                    style={{ marginInlineStart: "auto", transform: on ? "rotate(180deg)" : "none", transition: "transform var(--dur-base) var(--ease-out)" }} />
                </button>
                <div className="ct-mobile-sub" style={{ maxHeight: on ? 60 * g.links.length : 0 }}>
                  {g.links.map(([label, r, icon]) => (
                    <a key={label + r} href={"#/" + r} onClick={(e) => { e.preventDefault(); go(r); }}>
                      <DSK.Icon name={icon} size={16} color="var(--neutral-500)" />{label}
                    </a>
                  ))}
                </div>
              </div>
            );
          })}
        </nav>
      </div>
      {open ? <button type="button" className="ct-mobile-scrim" aria-label="Close menu" onClick={() => setOpen(false)}></button> : null}
    </div>
  );
}

const parseHash = () => {
  const raw = window.location.hash.replace(/^#\/?/, "").split("?")[0];
  const parts = raw.split("/").filter(Boolean);
  return { name: parts[0] || "home", param: parts.slice(1).join("/") || null };
};

function App() {
  const [route, setRoute] = React.useState(parseHash);
  const [lang, setLang] = React.useState(window.CT_I18N.lang);
  const [toast, setToast] = React.useState(null);
  const [narrow, setNarrow] = React.useState(() => window.innerWidth < 1180);

  React.useEffect(() => {
    const onHash = () => { setRoute(parseHash()); window.scrollTo({ top: 0 }); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  React.useEffect(() => {
    const onResize = () => setNarrow(window.innerWidth < 1180);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  React.useEffect(() => { window.CT_TOAST = (msg) => { setToast(msg); window.setTimeout(() => setToast(null), 3200); }; }, []);
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  /* Machine translation lands asynchronously, so show progress while it does. */
  const [translating, setTranslating] = React.useState(false);
  React.useEffect(() => {
    if (lang === "EN") { setTranslating(false); return; }
    const id = window.setInterval(() => setTranslating(window.CT_I18N.pending > 0), 300);
    return () => window.clearInterval(id);
  }, [lang]);

  /* Re-apply the phrase sweep after every render, since React replaces text nodes. */
  React.useEffect(() => { window.CT_I18N.sweep(); });

  const setLanguage = (code) => { window.CT_I18N.set(code); setLang(code); };

  /* The portal sidebar carries its own switcher, so follow the shared source of truth. */
  React.useEffect(() => window.CT_I18N.subscribe(setLang), []);

  /* Menus and cards mount after the render pass, so watch the tree too. */
  React.useEffect(() => {
    const root = document.getElementById("root");
    if (!root || lang === "EN") return;
    let queued = false;
    const mo = new MutationObserver(() => {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(() => { queued = false; window.CT_I18N.sweep(); });
    });
    mo.observe(root, { childList: true, subtree: true });
    return () => mo.disconnect();
  }, [lang]);

  const { name, param } = route;
  const activeMap = { study: "Study in Türkiye", universities: "Universities", university: "Universities", service: "Services", partners: "Partners", representative: "Partners", institutions: "Partners", portal: "Partners", about: "About" };
  const navLabels = { study: T("nav.study"), universities: T("nav.universities"), Services: T("nav.services"), Partners: T("nav.partners"), about: T("nav.about") };
  const navItems = D.nav.map((n) => ({
    label: n.route ? (navLabels[n.route] || n.label) : (navLabels[n.label] || n.label),
    href: n.route ? "#/" + n.route : undefined,
    children: n.mega ? MEGA[n.mega] : undefined,
    _route: n.route,
  }));
  const chrome = name !== "portal";

  let page = null;
  if (name === "home") page = <HomeScreen data={D} />;
  else if (name === "study") page = <StudyScreen data={D} />;
  else if (name === "universities") page = <UniversitiesScreen data={D} />;
  else if (name === "university") page = <UniversityDetailScreen data={D} slug={param} />;
  else if (name === "service") page = <ServiceScreen data={D} slug={param || "medical"} />;
  else if (name === "partners") page = <PartnersScreen data={D} />;
  else if (name === "representative") page = <RepresentativeScreen data={D} />;
  else if (name === "institutions") page = <InstitutionScreen data={D} slug={param || "universities"} />;
  else if (name === "apply") page = <ApplyScreen onHome={() => window.CT_GO("home")} />;
  else if (name === "portal") page = param === "dashboard"
    ? <PortalDashboard data={D} />
    : <PartnerLoginScreen onHome={() => window.CT_GO("home")} />;
  else if (name === "about") page = <AboutScreen data={D} />;
  else if (name === "contact") page = <ContactScreen data={D} />;
  else if (name === "resources") page = <ResourcesScreen data={D} />;
  else if (name === "blog") page = <BlogPostScreen data={D} slug={param} />;
  else if (name === "error") page = <ErrorScreen state={ERROR_STATES[param] ? param : "notFound"} />;
  else page = <NotFoundScreen />;

  const footerTitles = { Education: T("footer.education"), Services: T("footer.services"), Partners: T("footer.partners"), Company: T("footer.company") };

  return (
    <div>
      <ScrollProgress />
      {chrome ? (
        <>
        <MobileNav lang={lang} onLangChange={setLanguage} route={name + (param || "")} />
        <div className="ct-desktop-nav">
        <Navbar items={navItems} activeItem={activeMap[name]} lang={lang} onLangChange={setLanguage} assetBase={AK}
          ctaLabel={T("cta.apply")} ctaHref="#/apply" secondaryLabel={narrow ? "" : "Partner Login"}
          onSelect={(item, e) => {
            /* A group trigger has no destination. Without this it falls through to the
               design system's placeholder href and navigates away, which is the only
               way into the menu on a touch device. */
            if (item.children && !item.href) { if (e) e.preventDefault(); return; }
            if (item.href) { if (e) e.preventDefault(); window.CT_GO(item.href.replace(/^#\//, "")); }
          }} />
        </div>
        </>
      ) : null}

      <div className="ct-page" key={name + (param || "")}>
        <OfflineGuard>
          <RouteBoundary routeKey={name + (param || "")}>{page}</RouteBoundary>
        </OfflineGuard>
      </div>

      {chrome ? (
        <>
          <Footer columns={D.footerColumns.map((c) => ({ title: footerTitles[c.title] || c.title, links: c.links.map((l) => ({ ...l, href: "#/" + l.route })) }))}
            contact={D.contact} socials={D.socials} lang={lang} onLangChange={setLanguage} assetBase={AK}
            legal="© 2026 Campus Turkey. Your guide to study in Turkey." />
          <window.WhatsAppAction label={T("cta.whatsapp")} fixed />
        </>
      ) : null}

      {toast ? <div className="ct-toast">{toast}</div> : null}
      {translating ? <div className="ct-toast ct-translating"><i></i>Translating this page</div> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
window.setTimeout(() => {
  const l = document.getElementById("ct-loader");
  if (l) { l.classList.add("gone"); window.setTimeout(() => l.remove(), 600); }
}, 900);
</script></body></html>
